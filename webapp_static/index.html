<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
  <meta name="color-scheme" content="light dark">
  <title>Football picks</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <link rel="stylesheet" href="/app/app.css">
</head>
<body>
  <header class="top">
    <div class="tabs" role="tablist">
      <button class="tab active" data-range="today" role="tab">Today</button>
      <button class="tab" data-range="upcoming" role="tab">Next 3 days</button>
    </div>
    <input id="search" class="search" type="search" placeholder="Search league or team" autocomplete="off">
  </header>
  <main id="view" class="view"></main>
  <button id="slipBtn" class="slip-fab hidden">🧾 Slip <span id="slipCount">0</span> · <span id="slipOdds">1.00</span></button>
  <div id="toast" class="toast hidden"></div>
  <script src="/app/app.js"></script>
</body>
</html>
